services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      LOG_FILE: /var/log/ecom/api.jsonl
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=public&sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - api_logs:/var/log/ecom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
   build:
      context: .
      dockerfile: Dockerfile
   command: ["./worker"]
   env_file:
     - .env
   environment:
     LOG_FILE: /var/log/ecom/worker.jsonl
     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=public&sslmode=disable
     REDIS_URL: redis://redis:6379
   volumes:
     - api_logs:/var/log/ecom
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  api_logs:
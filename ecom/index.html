<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>olx api</title>
</head>
<body>
    <p id="status"> status: fetching listings</p>

    <div id="renderListings">

    </div>
    <script>
        let productListings = [];

        const statusEl = document.getElementById("status");
        const renderListingElem = document.getElementById("renderListings");

        async function listings() {
            try {
                const res = await fetch("https://go.abhinayjangde.dev/listings");
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();
                productListings = data;

                renderListingElem.innerHTML = "";

                
                productListings.forEach((item) => {
                    let container = document.createElement("div");
                    const p = document.createElement("p");
                    let deleteBtn = document.createElement("button")


                    container.style.backgroundColor = "lightgreen";
                    container.style.padding = "5px 10px";
                    container.style.margin = "5px";
                    container.style.display = "flex";
                    container.style.alignItems= "center"
                    container.style.gap = "10px"

                    p.textContent = `${item.title} - ${item.city} - ₹${item.price}`;

                    deleteBtn.textContent = "delete"
                    deleteBtn.id = "delete-listing"
                    deleteBtn.onclick = async function(){
                        await fetch(`https://go.abhinayjangde.dev/listings/${item.id}`,{
                            method: "DELETE"
                        })

                    }
                    container.appendChild(p)
                    container.appendChild(deleteBtn)
                    renderListingElem.appendChild(container);
                });

                statusEl.textContent = `status: fetched ${productListings.length} listings`;
                // console.log("productListings:", productListings);
            } catch (error) {
                statusEl.textContent = "status: error fetching listings";
                console.error(error);
            }
        }

        listings();
    </script>
</body>
</html>
